spring.security.oauth2.client.provider.testrealm.issuer-uri=http://localhost:9093/auth/realms/testrealm
isy.security.oauth2.client.default-certificate-ou=TESTOU
# client credentials test client (has Rolle1 -> Recht1)
spring.security.oauth2.client.registration.cc-testclient.client-id=cc-testclient-id
spring.security.oauth2.client.registration.cc-testclient.client-secret=cc-testclient-secret
spring.security.oauth2.client.registration.cc-testclient.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.cc-testclient.provider=testrealm
# client credentials test client with insufficient rights (Rolle2)
spring.security.oauth2.client.registration.cc-insufficient-testclient.client-id=cc-insufficient-testclient-id
spring.security.oauth2.client.registration.cc-insufficient-testclient.client-secret=cc-insufficient-testclient-secret
spring.security.oauth2.client.registration.cc-insufficient-testclient.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.cc-insufficient-testclient.provider=testrealm
